name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint with web-ext
        run: npx --yes web-ext lint --source-dir .

      - name: Build extension package
        run: npx --yes web-ext build --source-dir . --artifacts-dir web-ext-artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-clearcontainer
          path: web-ext-artifacts/*.zip

      - name: Publish "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest build
          commit: ${{ github.sha }}
          artifacts: web-ext-artifacts/*.zip
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          body: Automatically built from the latest push to `main` (${{ github.sha }}).
